name: build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ImpactNexus.sln
      - run: dotnet build ImpactNexus.sln --no-restore -c Release
      - run: dotnet test tests/ImpactNexus.Tests --no-build -c Release